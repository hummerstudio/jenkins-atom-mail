name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  atom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Build and smoke test
        run: ./tools/smoke.sh
      - uses: actions/upload-artifact@v4
        with:
          name: mail-atom
          path: dist/mail/
